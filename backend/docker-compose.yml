# API + PostgreSQL. Put the settings in backend/.env (not committed):
#   POSTGRES_PASSWORD=change-me
#   REQUIRE_REGISTERED_USER=false   # set true before recruiting
# then: docker compose up -d --build
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: postureguard
      POSTGRES_USER: postureguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postureguard"]
      interval: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://postureguard:${POSTGRES_PASSWORD}@db:5432/postureguard
      REQUIRE_REGISTERED_USER: ${REQUIRE_REGISTERED_USER:-false}
      ONBOARDING_FORM: /srv/onboarding.html
    volumes:
      # Served at /onboarding; a git pull updates it without a rebuild.
      - ../study/participant_onboarding.html:/srv/onboarding.html:ro
    depends_on:
      db:
        condition: service_healthy
    # Reachable from this machine only: the host's reverse proxy, on the
    # same machine, terminates HTTPS and forwards here.
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
